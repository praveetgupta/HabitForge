name: Bug report
description: Something in HabitForge does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Calendar-sensitive logic (streaks, schedules, weekly quotas)
        depends heavily on specific dates — please include them if they are relevant.

  - type: dropdown
    id: module
    attributes:
      label: Which part of the app?
      options: [Habits, Todos, Workouts, Settings, Notifications, Other]
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a habit with ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: ios-version
    attributes:
      label: iOS version
      placeholder: "18.5"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device or simulator
      placeholder: "iPhone 15 Pro / iPhone 17 Pro Simulator"
    validations:
      required: true
