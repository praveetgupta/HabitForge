name: Feature request
description: Suggest something HabitForge should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        HabitForge is deliberately local-first and dependency-free. Features needing an
        account, a server or a third-party SDK are a hard sell — but make the case anyway.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you are in, not just the feature you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What should it do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you have tried or considered instead?
