name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # macos-14 rather than macos-15: on the macos-15 image xcodebuild enumerates no
    # concrete iOS Simulator destinations at all — only visionOS entries and the bare
    # "Any iOS Simulator Device" placeholder — even with a freshly created and booted
    # iPhone that simctl reports as available, under every installed Xcode.
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select a working Xcode and simulator
        id: toolchain
        run: |
          # Do not assume the newest Xcode works: the runner can carry one that is newer
          # than its own macOS (Xcode 26.3 on macOS 15.7), which enumerates no iOS
          # Simulator destinations even though `simctl` still lists iOS runtimes.
          # The script asks each Xcode what it can really build for and picks accordingly.
          python3 Tools/ci-select-toolchain.py > toolchain.env
          cat toolchain.env
          cat toolchain.env >> "$GITHUB_ENV"
          cat toolchain.env >> "$GITHUB_OUTPUT"
          sudo xcode-select -s "$(grep '^DEVELOPER_DIR=' toolchain.env | cut -d= -f2-)"
          xcodebuild -version

      - name: Build
        env:
          NSUnbufferedIO: YES
        run: |
          xcodebuild build \
            -project HabitForge.xcodeproj \
            -scheme HabitForge \
            -destination "${{ steps.toolchain.outputs.DESTINATION }}" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Unit tests
        env:
          NSUnbufferedIO: YES
        run: |
          xcodebuild test \
            -project HabitForge.xcodeproj \
            -scheme HabitForge \
            -destination "${{ steps.toolchain.outputs.DESTINATION }}" \
            -only-testing:HabitForgeTests \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
            -quiet

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
